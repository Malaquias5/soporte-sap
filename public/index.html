<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoporteSAP Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <div class="layout">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">S</span>
        <div>
          <strong>SoporteSAP</strong>
          <small>Service Desk</small>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item active" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
          Panel de tickets
        </a>
        <button class="nav-item" type="button" data-accion="nuevo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          Nuevo ticket
        </button>
      </nav>
      <p class="sidebar-foot">v1.0 · Mesa de ayuda SAP</p>
    </aside>

    <!-- Contenido -->
    <div class="content">
      <header class="topbar">
        <div>
          <h1>Panel de tickets</h1>
          <p class="muted">Registra, prioriza y cierra las incidencias de tus clientes SAP.</p>
        </div>
        <button class="btn btn-primary" type="button" data-accion="nuevo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          Nuevo ticket
        </button>
      </header>

      <main class="main">
        <!-- Indicadores -->
        <section class="kpis" aria-label="Resumen">
          <article class="kpi"><span class="kpi-label">Total</span><strong id="kpi-total">–</strong></article>
          <article class="kpi kpi-abierto"><span class="kpi-label">Abiertos</span><strong id="kpi-abierto">–</strong></article>
          <article class="kpi kpi-proceso"><span class="kpi-label">En proceso</span><strong id="kpi-proceso">–</strong></article>
          <article class="kpi kpi-cerrado"><span class="kpi-label">Cerrados</span><strong id="kpi-cerrado">–</strong></article>
        </section>

        <!-- Tabla -->
        <section class="card">
          <div class="card-head">
            <h2>Tickets</h2>
            <div class="segmented" id="filtro" role="tablist" aria-label="Filtrar por estado">
              <button type="button" class="active" data-estado="">Todos</button>
              <button type="button" data-estado="Abierto">Abierto</button>
              <button type="button" data-estado="En proceso">En proceso</button>
              <button type="button" data-estado="Cerrado">Cerrado</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>N°</th><th>ID</th><th>Cliente</th><th>Módulo</th><th>Descripción</th>
                  <th>Prioridad</th><th>Estado</th><th class="right">Acciones</th>
                </tr>
              </thead>
              <tbody id="lista"><tr><td colspan="8" class="empty">Cargando…</td></tr></tbody>
            </table>
          </div>
          <footer class="card-foot">
            <span class="muted" id="resumen-pag"></span>
            <div class="pager">
              <button class="btn btn-ghost" id="anterior" type="button">Anterior</button>
              <span id="pagina">Página 1 de 1</span>
              <button class="btn btn-ghost" id="siguiente" type="button">Siguiente</button>
            </div>
          </footer>
        </section>
      </main>
    </div>
  </div>

  <!-- Formulario (crear / editar) -->
  <dialog id="modal">
    <form id="form" method="dialog">
      <header class="modal-head">
        <h2 id="titulo">Nuevo ticket</h2>
        <button type="button" class="icon-btn" id="cerrar" aria-label="Cerrar">✕</button>
      </header>
      <div class="grid">
        <label>Cliente <input id="cliente" required autocomplete="off"></label>
        <label>Módulo SAP
          <select id="modulo_sap">
            <option>FI</option><option>CO</option><option>MM</option><option>SD</option>
            <option>PP</option><option>HCM</option><option>BASIS</option><option>ABAP</option>
          </select>
        </label>
        <label>Prioridad
          <select id="prioridad"><option>Baja</option><option selected>Media</option><option>Alta</option></select>
        </label>
        <label class="full">Descripción <textarea id="descripcion" rows="4" required></textarea></label>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" id="cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="guardar">Crear ticket</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
